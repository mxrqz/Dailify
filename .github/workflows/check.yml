name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # vitest runs under Node; the web suite's --no-experimental-webstorage needs Node >= 22.4.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Server tests run in workerd (vitest-pool-workers) on the fixture bindings in
      # apps/server/vitest.config.ts; no secrets needed, and the live Stripe test skips itself.
      - run: bun run check
