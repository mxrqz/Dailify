name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.1.12297006

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner ships the Android SDK; only the NDK version is ours.
      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null

      # ponytail: arm64 only (nearly every phone in use); add armv7/x86_64 targets if someone needs them.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri

      - run: bun install --frozen-lockfile

      - name: Android signing
        working-directory: apps/web/src-tauri/gen/android
        # Secrets via env, never ${{ }} in the script: a `$`, quote or backtick would be evaluated.
        env:
          KEY_B64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'password=%s\n' "$KEY_PASSWORD"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload.jks"
          } > keystore.properties

      # Tag v1.2.3-beta.1 -> versionName 1.2.3-beta.1; versionCode = run number, always increasing.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "config={\"version\":\"$v\",\"bundle\":{\"android\":{\"versionCode\":${GITHUB_RUN_NUMBER}}}}" >> "$GITHUB_OUTPUT"

      - name: Build APK + AAB
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          TAURI_CONFIG: ${{ steps.version.outputs.config }}
        # Vite inlines VITE_API_URL: unset, the APK ships with apiURL undefined and no error.
        run: |
          : "${VITE_API_URL:?VITE_API_URL repo variable is not set}"
          NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" bun run tauri android build --ci --apk --aab --target aarch64 --config "$TAURI_CONFIG"

      - name: Collect
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir dist-android
          find apps/web/src-tauri/gen/android/app/build/outputs -name "*release*.apk" -exec cp {} "dist-android/mewki-$NAME.apk" \;
          find apps/web/src-tauri/gen/android/app/build/outputs -name "*release*.aab" -exec cp {} "dist-android/mewki-$NAME.aab" \;
          ls -l dist-android

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: dist-android/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      - uses: actions/upload-artifact@v6
        if: github.ref_type != 'tag'
        with:
          name: mewki-android
          path: dist-android/*
          if-no-files-found: error
