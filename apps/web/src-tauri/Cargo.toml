[package]
name = "mewki"
version = "0.1.0"
description = "Mewki"
authors = ["mxrqz"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mewki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
# `generate_context!` emite `serde_json::` pra config dos plugins.
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# Plugin de terceiro (s00d): versão fixada, subir só lendo o changelog. Sem `crypto` (BIP39/Ed25519).
tauri-plugin-keyring-store = { version = "=0.3.2", default-features = false }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-reminders = { path = "plugins/reminders" }
