name = "dailify-server"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "dailify"
database_id = "7fdd1f9f-c6b2-40e1-9a5f-3a13ec224580"

[vars]
ALLOWED_ORIGIN = "https://dailify.mxrqz.com"

# Varredura dos alertas vencidos (src/alerts.ts). 5 min é a granularidade do lembrete: mais curto
# gasta invocação à toa, mais longo faz o "avise 10 min antes" chegar visivelmente atrasado.
[triggers]
crons = ["*/5 * * * *"]

# Limites por usuario (ver middleware/rate-limit.ts). O da voz e ordens de grandeza menor porque
# cada chamada gasta Whisper + GPT: sem ele, um Pro+AI em loop queima dinheiro real.
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "VOICE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 6
  period = 60
