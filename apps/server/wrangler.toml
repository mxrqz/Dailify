name = "dailify-server"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
# Explicit, because deploy treats a missing [observability] as off and would disable Workers Logs.
upload_source_maps = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "dailify"
database_id = "7fdd1f9f-c6b2-40e1-9a5f-3a13ec224580"

[vars]
# A primeira é a WEB_URL dos links de login (auth-options.ts); the app's webview origins are
# NATIVE_ORIGINS in lib/origin.ts.
ALLOWED_ORIGIN = "https://mewki.mxrqz.com,https://dailify.mxrqz.com"

# E-mail do magic link (lib/email/providers/cloudflare.ts). O domínio do remetente tem que estar
# verificado no Email Service.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["entrar@mewki.mxrqz.com"]

# Varredura dos alertas vencidos (src/alerts.ts). 5 min é a granularidade do lembrete: mais curto
# gasta invocação à toa, mais longo faz o "avise 10 min antes" chegar visivelmente atrasado.
[triggers]
crons = ["*/5 * * * *"]

# Limites por usuario (ver middleware/rate-limit.ts). O da voz e ordens de grandeza menor porque
# cada chamada gasta Whisper + GPT: sem ele, um Max em loop queima dinheiro real.
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "VOICE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 6
  period = 60

# Login sem sessão: chave = IP (cf-connecting-ip). Cobre o pedido de link e o verify; o limite por
# e-mail (1/min) fica dentro do envio (auth-options.ts).
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 5
  period = 60
